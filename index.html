<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMA200 Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin: 10px 0 25px;
  font-size: 34px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.label {
  color: #6b7280;
  font-size: 17px;
  margin-bottom: 8px;
}

.value {
  font-size: 38px;
  font-weight: bold;
}

.small-value {
  font-size: 28px;
  font-weight: bold;
}

.signal {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  padding: 20px;
  border-radius: 16px;
  margin-top: 12px;
}

.invested {
  background: #dcfce7;
  color: #166534;
}

.out {
  background: #fee2e2;
  color: #991b1b;
}

.neutral {
  background: #e5e7eb;
  color: #374151;
}

.chart-card {
  padding-bottom: 18px;
}

.chart-wrapper {
  width: 100%;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 300px;
}

.legend {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 12px;
  font-size: 14px;
  color: #6b7280;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.price-dot {
  background: #111827;
}

.sma-dot {
  background: #2563eb;
}

.update {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  margin-top: 20px;
  line-height: 1.5;
}

.error {
  color: #991b1b;
  font-size: 14px;
  margin-top: 10px;
  text-align: center;
  word-break: break-word;
}

</style>
</head>


<body>

<div class="container">

<h1>SMA200 Dashboard</h1>


<div class="card">
  <div class="label">S&P 500 / SPY</div>
  <div class="value" id="price">...</div>
</div>


<div class="card">
  <div class="label">SMA200</div>
  <div class="small-value" id="sma">...</div>
</div>


<div class="card">
  <div class="label">Abstand zum SMA200</div>
  <div class="small-value" id="distance">...</div>
</div>


<div class="card">
  <div class="label">ZahlGraf-Regel</div>
  <div id="signal" class="signal neutral">DATEN WERDEN GELADEN</div>
</div>


<div class="card chart-card">
  <div class="label">Verlauf SPY / SMA200</div>
  <div class="chart-wrapper">
    <canvas id="chart"></canvas>
  </div>
  <div class="legend">
    <span><span class="dot price-dot"></span> SPY</span>
    <span><span class="dot sma-dot"></span> SMA200</span>
  </div>
</div>


<div class="update">
  Letzte Aktualisierung:
  <br>
  <span id="updated">...</span>
  <div id="error" class="error"></div>
</div>

</div>


<script>

// =====================================================
// EINSTELLUNGEN
// =====================================================

const API_KEY = "700BBS7NX2KASU5";
const SYMBOL = "SPY";
const CACHE_KEY = "sma200_dashboard_cache_v2";


// =====================================================
// GLOBALE DATEN
// =====================================================

let savedPriceData = null;
let savedSmaData = null;


// =====================================================
// ZAHLEN FORMATIEREN
// =====================================================

function formatNumber(value) {
  return Number(value).toLocaleString("de-DE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}


// =====================================================
// FEHLER ANZEIGEN
// =====================================================

function showError(message) {
  document.getElementById("signal").textContent = "⚠️ DATENFEHLER";
  document.getElementById("signal").className = "signal neutral";
  document.getElementById("error").textContent = message;
}


// =====================================================
// API-ANTWORT PRÜFEN
// =====================================================

function checkApiResponse(data, name) {
  if (data["Error Message"]) {
    throw new Error(name + ": " + data["Error Message"]);
  }

  if (data["Note"]) {
    throw new Error(name + ": Alpha-Vantage API-Limit erreicht.");
  }

  if (data["Information"]) {
    throw new Error(name + ": " + data["Information"]);
  }
}


// =====================================================
// CHART
// =====================================================

function drawChart() {
  if (!savedPriceData || !savedSmaData) {
    return;
  }

  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  const width = canvas.clientWidth;
  const height = 300;

  if (width <= 0) {
    return;
  }

  const ratio = window.devicePixelRatio || 1;
  canvas.width = width * ratio;
  canvas.height = height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  const dates = Object.keys(savedSmaData)
    .filter(date => savedPriceData[date])
    .sort()
    .slice(-300);

  if (dates.length < 2) {
    return;
  }

  const prices = dates.map(date => Number(savedPriceData[date]["4. close"]));
  const smas = dates.map(date => Number(savedSmaData[date]["SMA"]));
  const values = prices.concat(smas);

  let min = Math.min(...values);
  let max = Math.max(...values);
  const extra = (max - min) * 0.10;

  min -= extra;
  max += extra;

  const left = 45;
  const right = 10;
  const top = 15;
  const bottom = 30;

  const chartWidth = width - left - right;
  const chartHeight = height - top - bottom;

  ctx.clearRect(0, 0, width, height);

  // Hilfslinien
  ctx.strokeStyle = "#e5e7eb";
  ctx.lineWidth = 1;

  for (let i = 0; i <= 4; i++) {
    const y = top + chartHeight * i / 4;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(width - right, y);
    ctx.stroke();

    const value = max - (max - min) * i / 4;
    ctx.fillStyle = "#9ca3af";
    ctx.font = "11px Arial";
    ctx.textAlign = "right";
    ctx.fillText(value.toFixed(0), left - 6, y + 4);
  }

  function getX(index) {
    return left + (index / (dates.length - 1)) * chartWidth;
  }

  function getY(value) {
    return top + ((max - value) / (max - min)) * chartHeight;
  }

  // SPY Linie
  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  prices.forEach((value, index) => {
    const x = getX(index);
    const y = getY(value);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // SMA200 Linie
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  smas.forEach((value, index) => {
    const x = getX(index);
    const y = getY(value);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Datum
  ctx.fillStyle = "#9ca3af";
  ctx.font = "10px Arial";
  ctx.textAlign = "left";
  ctx.fillText(dates[0], left, height - 8);

  ctx.textAlign = "right";
  ctx.fillText(dates[dates.length - 1], width - right, height - 8);
}


// =====================================================
// DATEN LADEN (MIT LOCALSTORAGE CACHING & COMPACT DATA)
// =====================================================

async function loadData() {
  try {
    document.getElementById("error").textContent = "";
    document.getElementById("signal").textContent = "DATEN WERDEN GELADEN";
    document.getElementById("signal").className = "signal neutral";

    const todayStr = new Date().toISOString().split("T")[0];
    const cachedData = localStorage.getItem(CACHE_KEY);

    // 1. Prüfen, ob für HEUTE bereits gültige Daten im Cache liegen
    if (cachedData) {
      try {
        const parsed = JSON.parse(cachedData);
        if (parsed.cacheDate === todayStr && parsed.timeSeries && parsed.smaSeries) {
          savedPriceData = parsed.timeSeries;
          savedSmaData = parsed.smaSeries;

          renderDashboard(parsed.latestDate, parsed.smaDate, parsed.isCached);
          return;
        }
      } catch (e) {
        console.warn("Ungültiger Cache wird überschrieben.", e);
      }
    }

    // 2. SPY Kursdaten laden (compact = kostenlos)
    const priceUrl =
      "https://www.alphavantage.co/query" +
      "?function=TIME_SERIES_DAILY" +
      "&symbol=" + SYMBOL +
      "&outputsize=compact" +
      "&datatype=json" +
      "&apikey=" + API_KEY +
      "&_=" + Date.now();

    const priceResponse = await fetch(priceUrl, { cache: "no-store" });
    if (!priceResponse.ok) {
      throw new Error("HTTP-Fehler SPY: " + priceResponse.status);
    }

    const priceData = await priceResponse.json();
    checkApiResponse(priceData, "SPY");

    const timeSeries = priceData["Time Series (Daily)"];
    if (!timeSeries) {
      throw new Error("Keine SPY-Kursdaten erhalten.");
    }

    // 1,5 Sekunden Pause, um das API Rate-Limit (1 Req/Sek) zu beachten
    await new Promise(resolve => setTimeout(resolve, 1500));

    // 3. SMA200 Daten laden (kostenlos)
    const smaUrl =
      "https://www.alphavantage.co/query" +
      "?function=SMA" +
      "&symbol=" + SYMBOL +
      "&interval=daily" +
      "&time_period=200" +
      "&series_type=close" +
      "&datatype=json" +
      "&apikey=" + API_KEY +
      "&_=" + Date.now();

    const smaResponse = await fetch(smaUrl, { cache: "no-store" });
    if (!smaResponse.ok) {
      throw new Error("HTTP-Fehler SMA: " + smaResponse.status);
    }

    const smaData = await smaResponse.json();
    checkApiResponse(smaData, "SMA200");

    const smaSeries = smaData["Technical Analysis: SMA"];
    if (!smaSeries) {
      throw new Error("Keine SMA200-Daten erhalten.");
    }

    savedPriceData = timeSeries;
    savedSmaData = smaSeries;

    const dates = Object.keys(timeSeries).sort().reverse();
    const latestDate = dates[0];

    const smaDates = Object.keys(smaSeries).sort().reverse();
    const smaDate = smaDates[0];

    // 4. Im LocalStorage abspeichern
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify({
        cacheDate: todayStr,
        latestDate: latestDate,
        smaDate: smaDate,
        timeSeries: timeSeries,
        smaSeries: smaSeries,
        isCached: true
      })
    );

    renderDashboard(latestDate, smaDate, false);

  } catch (error) {
    console.error("Dashboard Fehler:", error);
    showError(error.message);
  }
}


// =====================================================
// DASHBOARD RENDERN
// =====================================================

function renderDashboard(latestDate, smaDate, isFromCache) {
  const price = Number(savedPriceData[latestDate]["4. close"]);
  const sma200 = Number(savedSmaData[smaDate || latestDate]["SMA"]);

  const distance = ((price - sma200) / sma200) * 100;

  document.getElementById("price").textContent = formatNumber(price);
  document.getElementById("sma").textContent = formatNumber(sma200);
  document.getElementById("distance").textContent =
    (distance >= 0 ? "+" : "") + distance.toFixed(2) + " %";

  const signal = document.getElementById("signal");
  if (price >= sma200) {
    signal.textContent = "🟢 AMUMBO: EIN";
    signal.className = "signal invested";
  } else {
    signal.textContent = "🔴 AMUMBO: AUS";
    signal.className = "signal out";
  }

  drawChart();

  document.getElementById("updated").textContent =
    "Kurs: " + latestDate + " | SMA200: " + (smaDate || latestDate) + (isFromCache ? " (Cache)" : "");
}


// =====================================================
// BEIM ÖFFNEN / REFRESH LADEN
// =====================================================

loadData();


// =====================================================
// RESIZE: NUR CHART NEU ZEICHNEN
// =====================================================

window.addEventListener("resize", drawChart);

</script>

</body>
</html>
